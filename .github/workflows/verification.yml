# Vérification automatique de chaque pull request (et de chaque fusion sur main).
# Bloque les erreurs TypeScript, les tests d'accès par clinique qui échouent et les builds cassés.
name: Vérification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types (TypeScript)
        run: npm run typecheck

      - name: Tests des règles d'accès par clinique
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Valeurs factices : le build n'a pas besoin des vraies clés (aucune donnée n'est lue)
          NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-factice
          SUPABASE_SERVICE_ROLE_KEY: cle-factice
          NEXT_TELEMETRY_DISABLED: 1

      - name: Vulnérabilités (production)
        run: npm audit --omit=dev --audit-level=high

  bout-en-bout:
    name: Tests de bout en bout (Playwright)
    # Version d'Ubuntu fixée : Playwright installe ses dépendances système pour les versions qu'il connaît
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-factice
      SUPABASE_SERVICE_ROLE_KEY: cle-factice
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer Chromium
        # L'installation se bloque parfois (miroirs apt) : délai limité et nouvel essai
        timeout-minutes: 12
        run: |
          for essai in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "Installation de Chromium interrompue (essai $essai), nouvel essai…"
          done
          exit 1
      - name: Build
        run: npm run build
      - name: Tests de bout en bout
        run: npm run e2e
      - name: Traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-playwright
          path: test-results/
          retention-days: 7
